[tool.poetry]
name = "lotus-performance"
version = "0.1.0"
description = "API for calculating portfolio performance metrics."
authors = ["sandeepgajbi@gmail.com"]
license = "MIT"
readme = "README.md"

packages = [
    { include = "app" },
    { include = "engine" },
    { include = "adapters" },
    { include = "core" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
annotated-types = "0.7.0"
anyio = "4.10.0"
certifi = "2026.2.25"
click = "8.3.3"
colorama = "0.4.6"
fastapi = "0.136.3"
h11 = "0.16.0"
httpcore = "1.0.9"
httpx = "0.28.1"
idna = "3.18"
numpy = "2.3.2"
packaging = "25.0"
pandas = "2.3.2"
pydantic = "2.11.7"
pydantic-core = "2.33.2"
pydantic-settings = "2.10.1"
prometheus-fastapi-instrumentator = "8.0.0"
prometheus-client = "0.25.0"
python-dateutil = "2.9.0.post0"
python-dotenv = "1.2.2"
pytz = "2025.2"
six = "1.17.0"
sniffio = "1.3.1"
starlette = "1.3.1"
SQLAlchemy = "2.0.39"
psycopg = {version = "3.2.6", extras = ["binary"]}
typing-inspection = "0.4.2"
typing-extensions = "4.15.0"
tzdata = "2025.3"
uvicorn = "0.35.0"


[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"
pre-commit = "4.6.0"
pytest-cov = "4.1.0"
httpx2 = "2.4.0"
pytest-benchmark = "4.0.0"
pytest-mock = "3.15.1"
pytest-asyncio = "1.3.0"
pytest-randomly = "4.1.0"
coverage = "7.10.6"
pip-audit = "2.10.1"
ruff = "0.6.9"
mypy = "1.20.2"
radon = "6.0.1"
vulture = "2.16"
deptry = "0.25.1"
bandit = "1.9.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["asyncio"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
exclude = ["app/enterprise_readiness.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]


