[tool.poetry]
name = "lotus-performance"
version = "0.1.0"
description = "API for calculating portfolio performance metrics."
authors = ["sandeepgajbi@gmail.com"]
license = "MIT"
readme = "README.md"

packages = [
    { include = "app" },
    { include = "engine" },
    { include = "adapters" },
    { include = "core" },
]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = ">=0.136.3"
uvicorn = ">=0.20.0"
httpx = "^0.28.1"
numpy = "^2.3.2"
pandas = ">=1.0.0"
pydantic = ">=2.0.0"
pydantic-settings = "^2.10.1"
orjson = "^3.11.6"
prometheus-fastapi-instrumentator = "^8.0.0"
prometheus-client = "^0.25.0"
SQLAlchemy = "^2.0.39"
psycopg = {version = "^3.2.6", extras = ["binary"]}


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
python-dotenv = "^1.2.2"
pre-commit = "^4.2.0"
pytest-cov = "^6.2.1"
pytest-benchmark = "^4.0.0"
pytest-mock = "^3.14.1"
pytest-asyncio = "^1.3.0"
ruff = "^0.6.9"
mypy = "^1.11.2"
radon = "^6.0.1"
vulture = "^2.16"
deptry = "^0.25.1"
bandit = "^1.9.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["asyncio"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
exclude = ["app/enterprise_readiness.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]


