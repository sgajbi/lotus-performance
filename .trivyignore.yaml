# Container vulnerability acceptances for lotus-performance.
#
# quality/container_supply_chain_report.md requires every HIGH/CRITICAL finding to be
# zero OR explicitly accepted. Only the first half was implemented: the gate failed on
# every finding with no way to record an acceptance, so it had no passing state at all.
# Every entry below carries no upstream fix, so no change this repository can make would
# clear it -- which is what made the gate unpassable rather than strict.
#
# Rules, enforced by tests/unit/scripts/test_container_vulnerability_acceptances.py:
#   * an accepted finding must have no fixed version upstream; anything fixable must be
#     fixed, never accepted here
#   * every entry states what it is and when the acceptance lapses
#   * an expired entry fails the gate, so acceptance is revisited rather than inherited
#
# These are Debian base-image advisories in python:3.11-slim. Clearing them needs a base
# image decision, which is tracked separately; it is not a dependency bump.

