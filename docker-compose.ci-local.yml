services:
  ci-local:
    image: python:3.11-slim
    working_dir: /workspace
    tmpfs:
      - /workspace
    volumes:
      - type: bind
        source: .
        target: /source
        read_only: true
      - type: bind
        source: ${CI_LOCAL_GIT_DIR:?CI_LOCAL_GIT_DIR must name the checkout Git common directory}
        target: /git-common
      - type: bind
        source: ${CI_LOCAL_GIT_WORKTREE_DIR:?CI_LOCAL_GIT_WORKTREE_DIR must name the active Git directory}
        target: /git-worktree-source
        read_only: true
    command: >
      bash -lc "
      set -o pipefail &&
      tar -C /source
      --exclude=.git
      --exclude=.venv
      --exclude=artifacts
      --exclude=output
      --exclude=lineage_data
      --exclude='*.db'
      --exclude='*.db-shm'
      --exclude='*.db-wal'
      --exclude='.coverage*'
      --exclude=__pycache__
      --exclude=.pytest_cache
      --exclude=.mypy_cache
      --exclude=.ruff_cache
      -cf - . | tar -C /workspace -xf - &&
      mkdir /workspace/.git &&
      cp -a /git-worktree-source/. /workspace/.git/ &&
      printf '/git-common\n' > /workspace/.git/commondir &&
      apt-get update &&
      apt-get install -y --no-install-recommends git make &&
      rm -rf /var/lib/apt/lists/* &&
      git config --global --add safe.directory /workspace &&
      pip install --upgrade pip &&
      pip install -r requirements.txt -r requirements-dev.txt &&
      ruff check . &&
      ruff format --check . &&
      python scripts/dependency_health_check.py --requirement requirements.txt --requirement requirements-dev.txt &&
      python -m pip check &&
      COVERAGE_FILE=.coverage.unit python -m pytest tests/unit --cov=app --cov=engine --cov=core --cov=adapters --cov-report= &&
      COVERAGE_FILE=.coverage.integration python -m pytest tests/integration --cov=app --cov=engine --cov=core --cov=adapters --cov-report= &&
      COVERAGE_FILE=.coverage.e2e python -m pytest tests/e2e --cov=app --cov=engine --cov=core --cov=adapters --cov-report= &&
      python -m coverage combine .coverage.unit .coverage.integration .coverage.e2e &&
      python -m coverage report --fail-under=99 &&
      mypy --config-file mypy.ini
      "
