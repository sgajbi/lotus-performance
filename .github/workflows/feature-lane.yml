name: Remote Feature Lane

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"

jobs:
  workflow-lint:
    name: Feature Lane / Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  static-quality-gates:
    name: Feature Lane / Static Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Verify Installed Dependencies
        run: python -m pip check
      - name: Ruff Lint And Format
        run: make lint
      - name: Quality Complexity Gate
        run: make quality-complexity-gate
      - name: Quality Architecture Gate
        run: make quality-architecture-gate
      - name: Quality Router Thinness Gate
        run: make quality-router-thinness-gate
      - name: Quality Duplicate Code Gate
        run: make quality-duplicate-code-gate
      - name: No-Alias Contract Guard
        run: make no-alias-gate
      - name: Mypy Typecheck
        run: make typecheck

  contract-security-gates:
    name: Feature Lane / Contract Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Security Audit
        run: make security-audit
      - name: Python Security Gate
        run: make python-security-gate

  unit-tests:
    name: Feature Lane / Tests (unit)
    needs: [static-quality-gates, contract-security-gates]
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run unit tests
        run: python -m pytest tests/unit
