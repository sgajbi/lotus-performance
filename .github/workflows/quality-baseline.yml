name: Quality Baseline Snapshot

on:
  push:
    branches-ignore:
      - "main"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"

jobs:
  quality-snapshot:
    name: Quality Baseline / Snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Generate quality inventories
        run: make quality-baseline
      - name: Run quality evaluation gate
        run: make quality-evaluation-gate
      - name: Upload quality baseline artifacts
        uses: actions/upload-artifact@v7
        with:
          name: quality-baseline-reports
          path: |
            quality/*.md
            output/quality-baseline/*.md
      - name: Upload demo API certification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-api-certification-evidence
          path: output/demo-api-certification/*.json
          if-no-files-found: ignore
