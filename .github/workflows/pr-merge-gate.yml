name: Pull Request Merge Gate

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.11"
  COVERAGE_FAIL_UNDER: "99"
  CI_EVIDENCE_SHA: ${{ github.sha }}
  CI_EVIDENCE_RUN: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  python-admission:
    name: Image Admission / python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.admission.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          ref: 386b40e13e76e60e761c6c4068fbe7a11256ca29
          persist-credentials: false
          path: .image-policy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify exact distribution before acquisition
        id: admission
        env:
          SOURCE_IMAGE: docker.io/library/python@sha256:e529028263dbe6910a2d96f7d2b8f5266385e917fd45d286ef166977c094a51e
          DISTRIBUTION_IMAGE: public.ecr.aws/docker/library/python@sha256:e529028263dbe6910a2d96f7d2b8f5266385e917fd45d286ef166977c094a51e
        run: >-
          python .image-policy/automation/validate_technology_governance_policy.py
          --source-image "$SOURCE_IMAGE" --distribution-image "$DISTRIBUTION_IMAGE"
          --platform linux/amd64 --verify-distribution --github-output "$GITHUB_OUTPUT"
          --acquisition-evidence "$RUNNER_TEMP/image-acquisition-evidence"
      - name: Preserve failed public manifest responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-acquisition-failures-python
          path: ${{ runner.temp }}/image-acquisition-evidence
          if-no-files-found: ignore
          retention-days: 14
  postgres16-admission:
    name: Image Admission / postgres16
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.admission.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          ref: 386b40e13e76e60e761c6c4068fbe7a11256ca29
          persist-credentials: false
          path: .image-policy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify exact distribution before acquisition
        id: admission
        env:
          SOURCE_IMAGE: docker.io/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
          DISTRIBUTION_IMAGE: public.ecr.aws/docker/library/postgres@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        run: >-
          python .image-policy/automation/validate_technology_governance_policy.py
          --source-image "$SOURCE_IMAGE" --distribution-image "$DISTRIBUTION_IMAGE"
          --platform linux/amd64 --verify-distribution --github-output "$GITHUB_OUTPUT"
          --acquisition-evidence "$RUNNER_TEMP/image-acquisition-evidence"
      - name: Preserve failed public manifest responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-acquisition-failures-postgres16
          path: ${{ runner.temp }}/image-acquisition-evidence
          if-no-files-found: ignore
          retention-days: 14
  postgres17-admission:
    name: Image Admission / postgres17
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.admission.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          ref: 386b40e13e76e60e761c6c4068fbe7a11256ca29
          persist-credentials: false
          path: .image-policy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify exact distribution before acquisition
        id: admission
        env:
          SOURCE_IMAGE: docker.io/library/postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          DISTRIBUTION_IMAGE: public.ecr.aws/docker/library/postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        run: >-
          python .image-policy/automation/validate_technology_governance_policy.py
          --source-image "$SOURCE_IMAGE" --distribution-image "$DISTRIBUTION_IMAGE"
          --platform linux/amd64 --verify-distribution --github-output "$GITHUB_OUTPUT"
          --acquisition-evidence "$RUNNER_TEMP/image-acquisition-evidence"
      - name: Preserve failed public manifest responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-acquisition-failures-postgres17
          path: ${{ runner.temp }}/image-acquisition-evidence
          if-no-files-found: ignore
          retention-days: 14
  trivy-admission:
    name: Image Admission / trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      image: ${{ steps.admission.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          ref: 386b40e13e76e60e761c6c4068fbe7a11256ca29
          persist-credentials: false
          path: .image-policy
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify exact distribution before acquisition
        id: admission
        env:
          SOURCE_IMAGE: docker.io/aquasec/trivy@sha256:f5d0e600ecda7449e2a9b272805aef698631d3bb3f3a739a750de2c6819acdc9
          DISTRIBUTION_IMAGE: ghcr.io/aquasecurity/trivy@sha256:f5d0e600ecda7449e2a9b272805aef698631d3bb3f3a739a750de2c6819acdc9
        run: >-
          python .image-policy/automation/validate_technology_governance_policy.py
          --source-image "$SOURCE_IMAGE" --distribution-image "$DISTRIBUTION_IMAGE"
          --platform linux/amd64 --verify-distribution --github-output "$GITHUB_OUTPUT"
          --acquisition-evidence "$RUNNER_TEMP/image-acquisition-evidence"
      - name: Preserve failed public manifest responses
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-acquisition-failures-trivy
          path: ${{ runner.temp }}/image-acquisition-evidence
          if-no-files-found: ignore
          retention-days: 14
  workflow-lint:
    name: PR Merge Gate / Workflow Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: reviewdog/action-actionlint@v1

  static-quality-gates:
    name: PR Merge Gate / Static Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Verify Installed Dependencies
        run: python -m pip check
      - name: Ruff Lint And Format
        run: make lint
      - name: Quality Complexity Gate
        run: make quality-complexity-gate
      - name: Quality Architecture Gate
        run: make quality-architecture-gate
      - name: Quality Router Thinness Gate
        run: make quality-router-thinness-gate
      - name: Quality Duplicate Code Gate
        run: make quality-duplicate-code-gate
      - name: Quality Observability Readiness Gate
        run: make quality-observability-readiness-gate
      - name: Quality Baseline Freshness
        run: make quality-baseline-check
      - name: No-Alias Contract Guard
        run: make no-alias-gate
      - name: Mypy Typecheck
        run: make typecheck

  contract-security-gates:
    name: PR Merge Gate / Contract Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: OpenAPI Gate
        run: make openapi-gate
      - name: API Vocabulary Gate
        run: make api-vocabulary-gate
      - name: Checkout Lotus Platform Contracts
        uses: actions/checkout@v6
        with:
          repository: sgajbi/lotus-platform
          path: .lotus-platform
      - name: Domain Product Validation
        run: make domain-product-validate
      - name: Quality Evaluation Gate
        run: make quality-evaluation-gate
      - name: Migration Contract Smoke
        run: make migration-smoke
      - name: License Compliance Gate
        run: make license-compliance-gate
      - name: Security Audit
        run: make security-audit
      - name: Python Security Gate
        run: make python-security-gate

  lineage-volume-recovery:
    name: PR Merge Gate / Lineage Volume Recovery
    needs: [python-admission, postgres17-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - name: Bind admitted images to the recovery files
        env:
          RUNTIME_IMAGE: ${{ needs.python-admission.outputs.image }}
          POSTGRES_IMAGE: ${{ needs.postgres17-admission.outputs.image }}
        run: python scripts/ci_image_bindings_gate.py --runtime-image "$RUNTIME_IMAGE" --postgres-image "$POSTGRES_IMAGE"
      - name: Prove non-root restart recovery
        run: make lineage-volume-recovery-smoke

  lint-typecheck-security:
    name: PR Merge Gate / Lint Typecheck Security
    needs: [static-quality-gates, contract-security-gates, lineage-volume-recovery]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify split quality and security gates passed
        run: |
          if [ "${{ needs.static-quality-gates.result }}" != "success" ]; then
            echo "Static quality gates did not pass: ${{ needs.static-quality-gates.result }}"
            exit 1
          fi
          if [ "${{ needs.contract-security-gates.result }}" != "success" ]; then
            echo "Contract security gates did not pass: ${{ needs.contract-security-gates.result }}"
            exit 1
          fi
          if [ "${{ needs.lineage-volume-recovery.result }}" != "success" ]; then
            echo "Lineage volume recovery did not pass: ${{ needs.lineage-volume-recovery.result }}"
            exit 1
          fi
          echo "Static quality, contract security, and lineage recovery gates passed."

  test-suites:
    name: PR Merge Gate / Tests (${{ matrix.suite }})
    needs: [static-quality-gates, contract-security-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            path: tests/unit
          - suite: integration
            path: tests/integration
          - suite: e2e
            path: tests/e2e
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Run tests with coverage data
        run: make test-coverage-shard SUITE=${{ matrix.suite }} TEST_PATH=${{ matrix.path }}
      - name: Bind coverage to this revision and run
        run: make coverage-shard-evidence SUITE=${{ matrix.suite }}
      - name: Upload coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.suite }}
          path: |
            .coverage.${{ matrix.suite }}
            .coverage.${{ matrix.suite }}.json
          include-hidden-files: true
          if-no-files-found: error

  postgres-contracts:
    name: PR Merge Gate / PostgreSQL Contracts
    needs: [static-quality-gates, contract-security-gates, postgres16-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ needs.postgres16-admission.outputs.image }}
        env:
          POSTGRES_DB: lotus_performance
          POSTGRES_PASSWORD: lotus
          POSTGRES_USER: lotus
        ports:
          - 5432:5432
        options: >-
          --platform linux/amd64
          --health-cmd "pg_isready -U lotus -d lotus_performance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Prove all nine PostgreSQL contract targets
        env:
          LOTUS_POSTGRES_PLAN_DATABASE_URL: postgresql+psycopg://lotus:lotus@127.0.0.1:5432/lotus_performance
        run: make postgres-concurrency-contracts-gate
      - name: Bind coverage to this revision and run
        run: make coverage-shard-evidence SUITE=postgres
      - name: Upload PostgreSQL coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-postgres
          path: |
            .coverage.postgres
            .coverage.postgres.json
          include-hidden-files: true
          if-no-files-found: error

  coverage-gate:
    name: PR Merge Gate / Coverage Gate (Combined)
    needs: [test-suites, postgres-contracts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
      - name: Install
        run: make install-ci
      - name: Require complete successful matrix and PostgreSQL proof
        env:
          CI_PROOF_RESULTS: ${{ toJSON(needs) }}
        run: make ci-proof-results-gate
      - name: Download coverage artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --pattern 'coverage-data-*' --dir coverage-data
      - name: Verify exact coverage inventory and provenance
        run: make coverage-evidence-gate COVERAGE_INPUTS=coverage-data
      - name: Enforce coverage floor
        run: make coverage-combine-gate COVERAGE_INPUTS=coverage-data COVERAGE_FAIL_UNDER=${{ env.COVERAGE_FAIL_UNDER }}

  container-supply-chain-evidence:
    name: PR Merge Gate / Container Supply Chain Evidence
    needs: [coverage-gate, python-admission, trivy-admission]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Configure Git Default Branch
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v6
      - name: Bind admitted image to the fixed Dockerfile
        env:
          RUNTIME_IMAGE: ${{ needs.python-admission.outputs.image }}
        run: python scripts/ci_image_bindings_gate.py --runtime-image "$RUNTIME_IMAGE"
      - name: Build image and generate container evidence
        env:
          CONTAINER_GIT_SHA: ${{ github.sha }}
          CONTAINER_GIT_BRANCH: ${{ github.ref_name }}
          CONTAINER_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          CONTAINER_CI_PIPELINE_RUN_ID: ${{ github.run_id }}
          TRIVY_IMAGE: ${{ needs.trivy-admission.outputs.image }}
        run: |
          CONTAINER_BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" make container-supply-chain-evidence
      - name: Upload container supply-chain evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-merge-container-supply-chain-evidence
          path: output/container-security/*.json
          if-no-files-found: error
      - name: Container Vulnerability Gate
        # Deliberately the script and not `make container-vulnerability-gate`. That target
        # depends on the phony report target, so invoking it here would scan a second time
        # and decide from a snapshot the uploaded artifact does not contain -- the exact
        # split the single-scan consolidation removed inside the Makefile, reintroduced by
        # the workflow composing two targets that each scan. The script refuses when the
        # report is absent, so this cannot pass by finding nothing to read.
        run: python scripts/container_acceptance_gate.py
