services:
  performance-lineage-db:
    image: postgres:17
    container_name: "${PA_LINEAGE_DB_CONTAINER_NAME:-performance-lineage-db}"
    environment:
      POSTGRES_DB: lotus_performance
      POSTGRES_USER: lotus
      POSTGRES_PASSWORD: lotus
    ports:
      - "${PA_LINEAGE_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lotus -d lotus_performance"]
      interval: 5s
      timeout: 5s
      retries: 20

  performance-lineage-volume-init:
    build:
      context: .
      target: runtime
    container_name: "${PA_LINEAGE_VOLUME_INIT_CONTAINER_NAME:-performance-lineage-volume-init}"
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        chown -R 10001:10001 /app/lineage_data
        chmod 0770 /app/lineage_data
        test "$$(stat -c '%u:%g:%a' /app/lineage_data)" = "10001:10001:770"
    volumes:
      - performance-lineage-data:/app/lineage_data
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  performance-analytics:
    build:
      context: .
      target: runtime
    container_name: "${PA_ANALYTICS_CONTAINER_NAME:-performance-analytics}"
    environment:
      CORE_CONTROL_PLANE_BASE_URL: "${CORE_CONTROL_PLANE_BASE_URL:-http://host.docker.internal:8202}"
      HTTP_ALLOWED_HOSTS: "${HTTP_ALLOWED_HOSTS:-testserver,localhost,127.0.0.1,host.docker.internal,*.dev.lotus}"
      LINEAGE_METADATA_DATABASE_URL: "${LINEAGE_METADATA_DATABASE_URL:-postgresql+psycopg://lotus:lotus@performance-lineage-db:5432/lotus_performance}"
    volumes:
      - performance-lineage-data:/app/lineage_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PA_HOST_PORT:-8002}:8000"
    depends_on:
      performance-lineage-db:
        condition: service_healthy
      performance-lineage-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  performance-lineage-worker:
    build:
      context: .
      target: runtime
    container_name: "${PA_LINEAGE_WORKER_CONTAINER_NAME:-performance-lineage-worker}"
    command: ["python", "-m", "app.workers.lineage_worker"]
    environment:
      CORE_CONTROL_PLANE_BASE_URL: "${CORE_CONTROL_PLANE_BASE_URL:-http://host.docker.internal:8202}"
      HTTP_ALLOWED_HOSTS: "${HTTP_ALLOWED_HOSTS:-testserver,localhost,127.0.0.1,host.docker.internal,*.dev.lotus}"
      LINEAGE_METADATA_DATABASE_URL: "${LINEAGE_METADATA_DATABASE_URL:-postgresql+psycopg://lotus:lotus@performance-lineage-db:5432/lotus_performance}"
    volumes:
      - performance-lineage-data:/app/lineage_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      performance-lineage-db:
        condition: service_healthy
      performance-lineage-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "lineage"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  performance-compute-executor:
    build:
      context: .
      target: runtime
    container_name: "${PA_COMPUTE_EXECUTOR_CONTAINER_NAME:-performance-compute-executor}"
    command: ["python", "-m", "app.workers.compute_executor_worker"]
    environment:
      CORE_CONTROL_PLANE_BASE_URL: "${CORE_CONTROL_PLANE_BASE_URL:-http://host.docker.internal:8202}"
      HTTP_ALLOWED_HOSTS: "${HTTP_ALLOWED_HOSTS:-testserver,localhost,127.0.0.1,host.docker.internal,*.dev.lotus}"
      LINEAGE_METADATA_DATABASE_URL: "${LINEAGE_METADATA_DATABASE_URL:-postgresql+psycopg://lotus:lotus@performance-lineage-db:5432/lotus_performance}"
    volumes:
      - performance-lineage-data:/app/lineage_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      performance-lineage-db:
        condition: service_healthy
      performance-lineage-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "compute-executor"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  performance-runtime-retention-worker:
    build:
      context: .
      target: runtime
    container_name: "${PA_RUNTIME_RETENTION_CONTAINER_NAME:-performance-runtime-retention-worker}"
    command: ["python", "-m", "app.workers.runtime_retention_worker"]
    profiles: ["ops"]
    environment:
      CORE_CONTROL_PLANE_BASE_URL: "${CORE_CONTROL_PLANE_BASE_URL:-http://host.docker.internal:8202}"
      HTTP_ALLOWED_HOSTS: "${HTTP_ALLOWED_HOSTS:-testserver,localhost,127.0.0.1,host.docker.internal,*.dev.lotus}"
      LINEAGE_METADATA_DATABASE_URL: "${LINEAGE_METADATA_DATABASE_URL:-postgresql+psycopg://lotus:lotus@performance-lineage-db:5432/lotus_performance}"
      RUNTIME_RETENTION_WORKER_APPLY: "${RUNTIME_RETENTION_WORKER_APPLY:-false}"
    volumes:
      - performance-lineage-data:/app/lineage_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      performance-lineage-db:
        condition: service_healthy
      performance-lineage-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck", "runtime-retention"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  performance-lineage-data:
